<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img">
<title>Any360: the simulated parts replaced by native code</title>
<desc>The same game talks to a native system and to native drawing that prepares commands ready for the PC, read by a Vulkan renderer without translation; three performance gains are numbered.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.t { font-size: 14px; font-weight: 600; }
.s { font-size: 12px; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .t { fill: #444441; } .gray .s { fill: #5F5E5A; }
.nat rect { fill: #E1F5EE; stroke: #0F6E56; } .nat .t { fill: #085041; } .nat .s { fill: #0F6E56; }
.gain circle { fill: #FAEEDA; stroke: #854F0B; } .gain text { fill: #633806; font-size: 12px; font-weight: 600; }
.a { stroke: #5F5E5A; fill: none; stroke-width: 1.5; }
.legend { fill: #5F5E5A; }
@media (prefers-color-scheme: dark) {
  .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .t { fill: #F1EFE8; } .gray .s { fill: #D3D1C7; }
  .nat rect { fill: #085041; stroke: #5DCAA5; } .nat .t { fill: #E1F5EE; } .nat .s { fill: #9FE1CB; }
  .gain circle { fill: #633806; stroke: #EF9F27; } .gain text { fill: #FAEEDA; }
  .a { stroke: #B4B2A9; } .legend { fill: #D3D1C7; }
}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="a" d="M2 1L8 5L2 9"/></marker></defs>
<g class="gray"><rect x="120" y="20" width="200" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="220" y="40" text-anchor="middle" dominant-baseline="central">The game</text>
<text class="s" x="220" y="58" text-anchor="middle" dominant-baseline="central">the same game code</text></g>
<path class="a" d="M220 74 L220 92 L115 92 L115 108" marker-end="url(#h)"/>
<path class="a" d="M220 92 L325 92 L325 108" marker-end="url(#h)"/>
<g class="nat"><rect x="20" y="110" width="190" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="105" y="130" text-anchor="middle" dominant-baseline="central">Native system</text>
<text class="s" x="105" y="148" text-anchor="middle" dominant-baseline="central">written for the PC</text></g>
<g class="gain"><circle cx="190" cy="136" r="10" stroke-width="0.75"/><text x="190" y="136" text-anchor="middle" dominant-baseline="central">3</text></g>
<g class="nat"><rect x="230" y="110" width="190" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="315" y="130" text-anchor="middle" dominant-baseline="central">Native drawing</text>
<text class="s" x="315" y="148" text-anchor="middle" dominant-baseline="central">PC-ready commands</text></g>
<g class="gain"><circle cx="400" cy="136" r="10" stroke-width="0.75"/><text x="400" y="136" text-anchor="middle" dominant-baseline="central">1</text></g>
<line class="a" x1="325" y1="164" x2="325" y2="198" marker-end="url(#h)"/>
<g class="nat"><rect x="230" y="200" width="190" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="315" y="220" text-anchor="middle" dominant-baseline="central">Vulkan renderer</text>
<text class="s" x="315" y="238" text-anchor="middle" dominant-baseline="central">no translation</text></g>
<g class="gain"><circle cx="400" cy="226" r="10" stroke-width="0.75"/><text x="400" y="226" text-anchor="middle" dominant-baseline="central">2</text></g>
<path class="a" d="M115 164 L115 310 L118 310" marker-end="url(#h)"/>
<path class="a" d="M325 254 L325 310 L322 310" marker-end="url(#h)"/>
<g class="gray"><rect x="120" y="290" width="200" height="40" rx="8" stroke-width="0.75"/>
<text class="t" x="220" y="310" text-anchor="middle" dominant-baseline="central">The PC</text></g>
<g class="gain"><circle cx="30" cy="358" r="9" stroke-width="0.75"/><text x="30" y="358" text-anchor="middle" dominant-baseline="central">1</text></g>
<text class="s legend" x="48" y="358" dominant-baseline="central">Graphics commands made up to 4.4x faster (measured)</text>
<g class="gain"><circle cx="30" cy="384" r="9" stroke-width="0.75"/><text x="30" y="384" text-anchor="middle" dominant-baseline="central">2</text></g>
<text class="s legend" x="48" y="384" dominant-baseline="central">No Xbox graphics chip to simulate</text>
<g class="gain"><circle cx="30" cy="410" r="9" stroke-width="0.75"/><text x="30" y="410" text-anchor="middle" dominant-baseline="central">3</text></g>
<text class="s legend" x="48" y="410" dominant-baseline="central">No simulation layer between the game and the PC</text>
</svg>
