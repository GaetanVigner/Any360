<svg xmlns="http://www.w3.org/2000/svg" width="440" height="430" viewBox="0 0 440 430" role="img">
<title>ReXGlue alone: the PC simulates an Xbox 360</title>
<desc>The game talks to a simulated Xbox system and to a simulated graphics chip that re-reads each Xbox command and redraws the scene tile by tile before the PC shows the image.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.t { font-size: 14px; font-weight: 600; }
.s { font-size: 12px; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .t { fill: #444441; } .gray .s { fill: #5F5E5A; }
.sim rect { fill: #FAECE7; stroke: #993C1D; } .sim .t { fill: #712B13; } .sim .s { fill: #993C1D; }
.a { stroke: #5F5E5A; fill: none; stroke-width: 1.5; }
.legend { fill: #5F5E5A; }
@media (prefers-color-scheme: dark) {
  .gray rect { fill: #444441; stroke: #B4B2A9; } .gray .t { fill: #F1EFE8; } .gray .s { fill: #D3D1C7; }
  .sim rect { fill: #712B13; stroke: #F0997B; } .sim .t { fill: #FAECE7; } .sim .s { fill: #F5C4B3; }
  .a { stroke: #B4B2A9; } .legend { fill: #D3D1C7; }
}
</style>
<defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="a" d="M2 1L8 5L2 9"/></marker></defs>
<g class="gray"><rect x="120" y="20" width="200" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="220" y="40" text-anchor="middle" dominant-baseline="central">The game</text>
<text class="s" x="220" y="58" text-anchor="middle" dominant-baseline="central">Xbox 360 code, translated</text></g>
<path class="a" d="M220 74 L220 92 L115 92 L115 108" marker-end="url(#h)"/>
<path class="a" d="M220 92 L325 92 L325 108" marker-end="url(#h)"/>
<g class="sim"><rect x="20" y="110" width="190" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="115" y="130" text-anchor="middle" dominant-baseline="central">Simulated Xbox system</text>
<text class="s" x="115" y="148" text-anchor="middle" dominant-baseline="central">files, gamepad, sound</text></g>
<g class="sim"><rect x="230" y="110" width="190" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="325" y="130" text-anchor="middle" dominant-baseline="central">Simulated graphics</text>
<text class="s" x="325" y="148" text-anchor="middle" dominant-baseline="central">re-reads each command</text></g>
<line class="a" x1="325" y1="164" x2="325" y2="198" marker-end="url(#h)"/>
<g class="sim"><rect x="230" y="200" width="190" height="52" rx="8" stroke-width="0.75"/>
<text class="t" x="325" y="220" text-anchor="middle" dominant-baseline="central">Simulated video memory</text>
<text class="s" x="325" y="238" text-anchor="middle" dominant-baseline="central">scene redrawn per tile</text></g>
<path class="a" d="M115 164 L115 310 L118 310" marker-end="url(#h)"/>
<path class="a" d="M325 254 L325 310 L322 310" marker-end="url(#h)"/>
<g class="gray"><rect x="120" y="290" width="200" height="40" rx="8" stroke-width="0.75"/>
<text class="t" x="220" y="310" text-anchor="middle" dominant-baseline="central">The PC</text></g>
<g class="sim"><rect x="24" y="364" width="12" height="12" rx="2" stroke-width="0.75"/></g>
<text class="s legend" x="44" y="370" dominant-baseline="central">Simulation work, redone every frame</text>
</svg>
